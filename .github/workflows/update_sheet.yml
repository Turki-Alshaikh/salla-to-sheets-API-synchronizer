name: Sync Salla Feed to Google Sheets

on:
  schedule:
    # يعمل تلقائياً كل يوم الساعة 3 فجراً بتوقيت السعودية (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # يضيف زر لتشغيل السكريبت يدوياً متى ما أردت

jobs:
  update-sheet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests gspread google-auth

      - name: Run Python script
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python main.py
